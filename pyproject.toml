[project]
name = "metamers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zevaz13", email = "rued7682@vandals.uidaho.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[project.scripts]
metamers = "metamers:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
src = ["src"]
